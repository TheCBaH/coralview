name: ci

# Every leg runs inside the repository devcontainer (.devcontainer/), built by
# TheCBaH/devcontainer-action from the image cache that images.yml publishes.
# All work is a make target.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    uses: ./.github/workflows/ocaml-versions.yml
  ci:
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.images_matrix) }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      env:
        OCAML_VERSION: ${{ matrix.ocaml_version }}
      with:
        variant: ${{ matrix.ocaml_version }}
        platform: ${{ matrix.platform }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: versions
      run: ${{ env.EXEC }} make versions
    - name: ci
      run: ${{ env.EXEC }} make ci
